packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: false
  sharp: true
  unrs-resolver: true
  workerd: true

# Keep the Prisma CLI toolchain on the same version as @prisma/orm-postgres,
# otherwise `prisma contract emit` fails with PSL_DEFAULT_TYPE_INCOMPATIBLE.
overrides:
  "@prisma/orm-toolchain": 8.0.0-rc.18
  "@prisma/cli-engine": 0.9.0

permissions:
  '@prisma/orm-postgres':
    skills: true
